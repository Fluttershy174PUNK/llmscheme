# llmscheme-service — schemes in docker.
# Volume lives next to this file: ./data (created by docker automatically).
services:
  llmscheme:
    # build from repo root — Dockerfile copies llmscheme-* paths relative to root
    build:
      context: ..
      dockerfile: llmscheme-service-mcp/Dockerfile
    container_name: llmscheme
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # CHANGE THIS before first start
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      PORT: 8080
      TOKEN_TTL_DAYS: ${TOKEN_TTL_DAYS:-30}
      DB_QUOTA_MB: ${DB_QUOTA_MB:-64}
      MAX_BODY_MB: ${MAX_BODY_MB:-8}
      MCP_ENABLED: ${MCP_ENABLED:-true}
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
