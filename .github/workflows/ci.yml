name: ci

on:
  push:
    branches: [main]
  pull_request:

# least privilege: this workflow only reads the repo and runs tests
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22.18+ runs .ts natively (type-stripping); 24 is the active LTS
        node: ["22", "24"]
    steps:
      # pinned by SHA (tag in the comment); renovate/dependabot should bump both
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # nothing here needs the token; keeping it out of the local git config
          # means a later step cannot leak it (zizmor artipacked)
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # unit + service tests in one go: service.test.ts spins its own server
      # on a random port in a temp DATA_DIR, so it parallelises safely with
      # the cli / core tests.
      - run: npm test
      # the build is the second half of "verify": artifacts + budgets + drift
      - run: npm run build
      - run: npm run sync-skill
      - run: npm run check
